# Simulated model replicas: llm-d-inference-sim pretends to be a vLLM server
# (same OpenAI API, queueing, KV/prefix cache and vllm:* metrics) without a
# GPU or model weights.
#
# One Deployment with 3 replicas; every pod carries app=vllm-sim, which is
# the selector the InferencePool (deploy/epp.yaml) uses to find them. Scale
# with: kubectl -n inferroute scale deploy/vllm-sim --replicas=N
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
  namespace: inferroute
  labels: {app: vllm-sim}
spec:
  replicas: 3
  selector:
    matchLabels: {app: vllm-sim}
  template:
    metadata:
      labels: {app: vllm-sim}
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.2
          imagePullPolicy: IfNotPresent
          args:
            - --port=8000
            - --model=meta-llama/Llama-3.1-8B-Instruct
            # echo mode + dummy tokenizer: no tokenizer download, no real
            # model; the simulator just times the request.
            - --mode=echo
            - --force-dummy-tokenizer
            # Cache: simulate a KV cache of 256 blocks so prefix reuse
            # (and eviction) actually happens.
            - --enable-kvcache
            - --kv-cache-size=256
            # Capacity: at most 8 requests in a batch; the rest wait in the
            # queue (vllm:num_requests_waiting). Lower this to make queueing,
            # and so routing differences, more visible.
            - --max-num-seqs=8
            # Timing: prefill cost per prompt token, then per-token decode.
            - --prefill-time-per-token=2ms
            - --inter-token-latency=25ms
            - --inter-token-latency-std-dev=5ms
            - --max-model-len=4096
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {containerPort: 8000, name: http}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
